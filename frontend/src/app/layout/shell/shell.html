<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      CRM immobilier
    </div>

    <nav class="sidebar-nav">

      <a routerLink="/dashboard" routerLinkActive="active">
        Dashboard
      </a>

      <a routerLink="/leads" routerLinkActive="active">
        Leads
      </a>

      <a routerLink="/contacts" routerLinkActive="active">
        Contacts
      </a>

      <a *ngIf="jwtService.hasRole('ROLE_ADMIN')"
         routerLink="/admin"
         routerLinkActive="active">
        Admin
      </a>

    </nav>

  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <header class="topbar">

      <span class="user-info">
        {{ jwtService.getCurrentUser()?.email }}
      </span>

      <button class="logout-btn" (click)="logout()">
        Logout
      </button>

    </header>

    <!-- CONTENT -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
